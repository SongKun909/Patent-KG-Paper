services:
  postgres:
    image: postgres:16-alpine
    container_name: patent-kg-db
    environment:
      POSTGRES_DB: patent_kg
      POSTGRES_USER: patent_admin
      POSTGRES_PASSWORD: patent_kg_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: patent-kg-neo4j
    environment:
      NEO4J_AUTH: neo4j/patent_kg_2026
    ports:
      - "7474:7474"   # HTTP (Browser UI)
      - "7687:7687"   # Bolt (app connection)
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
