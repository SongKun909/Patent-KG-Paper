{% extends "base.html" %}
{% block title %}专利管理 — Patent-KG{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold text-slate-800 mb-1">专利管理</h1>
<p class="text-sm text-slate-500 mb-8">上传、导入和管理专利文献</p>

<div class="grid grid-cols-3 gap-6 mb-8">
    <!-- Upload -->
    <div class="col-span-2 card p-6">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">上传专利 PDF</h2>
        <form hx-post="/api/patents/upload" hx-encoding="multipart/form-data" hx-target="#uploadResult" hx-swap="innerHTML"
              x-data="{ dragging: false, file: null, fileName: '' }"
              @dragover.prevent="dragging = true"
              @dragleave.prevent="dragging = false"
              @drop.prevent="dragging = false; file = $event.dataTransfer.files[0]; fileName = file ? file.name : ''"
              @change="$el.querySelector('input[type=file]').files[0] && (file = $el.querySelector('input[type=file]').files[0]; fileName = file.name)">
            <input type="file" name="file" accept=".pdf" required class="hidden" id="fileInput"
                   @change="fileName = $el.files[0]?.name || ''">
            <label for="fileInput"
                   :class="dragging ? 'border-blue-400 bg-blue-50' : 'border-slate-200 hover:border-slate-300'"
                   class="flex flex-col items-center justify-center p-10 border-2 border-dashed rounded-lg cursor-pointer transition-colors">
                <template x-if="!fileName">
                    <div class="text-center">
                        <svg class="w-10 h-10 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
                        <p class="text-sm text-slate-500">拖拽 PDF 文件到此处，或<span class="text-blue-600">点击选择</span></p>
                        <p class="text-xs text-slate-400 mt-1">支持 .pdf 格式，单文件最大 50MB</p>
                    </div>
                </template>
                <template x-if="fileName">
                    <div class="text-center">
                        <svg class="w-10 h-10 text-blue-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                        <p class="text-sm text-slate-700 font-medium" x-text="fileName"></p>
                        <p class="text-xs text-slate-400 mt-1">点击可重新选择文件</p>
                    </div>
                </template>
            </label>
            <button type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white py-2.5 rounded-lg text-sm font-medium transition-colors"
                    :disabled="!fileName">
                上传文件
            </button>
        </form>
        <div id="uploadResult" class="mt-3 text-sm"></div>
    </div>

    <!-- Bulk Import -->
    <div class="card p-6 flex flex-col">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">批量导入</h2>
        <p class="text-xs text-slate-400 mb-4">从服务器已有目录批量导入专利文件</p>
        <form hx-post="/api/patents/import" hx-target="#importResult" class="flex-1 flex flex-col">
            <label class="block text-xs text-slate-500 mb-1.5">目录路径</label>
            <input type="text" name="directory" placeholder="data/pdfs/CN"
                   class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors mb-4">
            <div class="mt-auto">
                <button type="submit" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 py-2 rounded-lg text-sm font-medium transition-colors">开始导入</button>
            </div>
        </form>
        <div id="importResult" class="mt-3 text-sm"></div>
    </div>
</div>

<!-- Patent Table -->
<div class="card overflow-hidden">
    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-700">专利列表</h2>
        <span class="text-xs text-slate-400">点击"抽取"开始智能提取技术指标</span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full data-table">
            <thead>
                <tr>
                    <th class="p-3 text-left w-16">ID</th>
                    <th class="p-3 text-left">文件名</th>
                    <th class="p-3 text-left w-16">语言</th>
                    <th class="p-3 text-right w-16">页数</th>
                    <th class="p-3 text-right w-20">大小</th>
                    <th class="p-3 text-left w-24">日期</th>
                    <th class="p-3 text-left w-28">操作</th>
                </tr>
            </thead>
            <tbody hx-get="/api/patents/?per_page=20" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
                <tr><td colspan="7" class="p-8 text-center text-sm text-slate-400">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
