{% extends "base.html" %}
{% block title %}专利管理 — Patent-KG{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold text-slate-800 mb-1">专利管理</h1>
<p class="text-sm text-slate-500 mb-8">上传、导入和管理专利文献</p>

<div class="grid grid-cols-3 gap-6 mb-8">
    <!-- Upload -->
    <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">上传专利</h2>
        <form hx-post="/api/patents/upload" hx-encoding="multipart/form-data" hx-target="#uploadResult" hx-swap="afterbegin">
            <div class="mb-4 p-5 border-2 border-dashed border-slate-200 rounded-lg text-center hover:border-blue-300 transition-colors cursor-pointer" onclick="this.querySelector('input').click()">
                <input type="file" name="file" accept=".pdf" required class="hidden">
                <svg class="w-6 h-6 text-slate-300 mx-auto mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                <p class="text-sm text-slate-400">点击选择 PDF 文件</p>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition-colors">上传</button>
        </form>
        <div id="uploadResult"></div>
    </div>

    <!-- Bulk Import -->
    <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">批量导入</h2>
        <form hx-post="/api/patents/import" hx-target="#importResult">
            <label class="block text-xs text-slate-500 mb-1.5">服务器目录路径</label>
            <input type="text" name="directory" placeholder="data/pdfs/CN" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors mb-4">
            <button type="submit" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded-lg text-sm font-medium transition-colors">批量导入</button>
        </form>
        <div id="importResult" class="mt-3 text-sm"></div>
    </div>

    <!-- Summary -->
    <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">概况</h2>
        <div class="space-y-3 text-sm">
            <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">中文专利</span><span class="font-medium text-slate-700">—</span></div>
            <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">英文专利</span><span class="font-medium text-slate-700">—</span></div>
            <div class="flex justify-between py-1.5"><span class="text-slate-500">扫描件</span><span class="font-medium text-slate-700">—</span></div>
        </div>
    </div>
</div>

<!-- Patent Table -->
<div class="card overflow-hidden">
    <div class="px-5 py-3.5 border-b border-slate-100">
        <h2 class="text-sm font-semibold text-slate-700">专利列表</h2>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full data-table">
            <thead>
                <tr>
                    <th class="p-3 text-left w-16">ID</th>
                    <th class="p-3 text-left">文件名</th>
                    <th class="p-3 text-left w-16">语言</th>
                    <th class="p-3 text-right w-16">页数</th>
                    <th class="p-3 text-right w-20">大小</th>
                    <th class="p-3 text-left w-24">日期</th>
                    <th class="p-3 text-left w-28">操作</th>
                </tr>
            </thead>
            <tbody hx-get="/api/patents/?per_page=20" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
                <tr><td colspan="7" class="p-8 text-center text-sm text-slate-400">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
