{% extends "base.html" %}
{% block title %}Patents — Patent-KG{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Patent Management</h1>

<!-- Upload -->
<div class="bg-gray-800 p-4 rounded-lg mb-6">
    <h2 class="text-lg font-semibold mb-3">Upload New Patent</h2>
    <form hx-post="/api/patents/upload" hx-encoding="multipart/form-data" hx-target="#uploadResult" hx-swap="afterbegin">
        <input type="file" name="file" accept=".pdf" required class="mb-3 text-sm">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Upload</button>
    </form>
    <div id="uploadResult"></div>
</div>

<!-- Bulk Import -->
<div class="bg-gray-800 p-4 rounded-lg mb-6">
    <h2 class="text-lg font-semibold mb-3">Bulk Import from Directory</h2>
    <form hx-post="/api/patents/import" hx-target="#importResult">
        <input type="text" name="directory" placeholder="e.g., data/pdfs/CN" class="w-full p-2 rounded bg-gray-700 border border-gray-600 mb-3">
        <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Import</button>
    </form>
    <div id="importResult" class="mt-3"></div>
</div>

<!-- Patent List -->
<div class="bg-gray-800 p-4 rounded-lg">
    <h2 class="text-lg font-semibold mb-3">Patent List</h2>
    <div hx-get="/api/patents/?per_page=20" hx-trigger="load" hx-target="#patentTable">
        <div id="patentTable" class="text-gray-400">Loading...</div>
    </div>
</div>
{% endblock %}
