{% extends "base.html" %}
{% block title %}专利管理 — Patent-KG{% endblock %}
{% block content %}

<div class="mb-8">
    <h1 class="text-2xl font-bold text-white tracking-tight">专利管理</h1>
    <p class="text-sm text-slate-500 mt-1 font-mono">上传 · 导入 · 管理专利文献</p>
</div>

<div class="grid grid-cols-3 gap-6 mb-6">
    <!-- Upload -->
    <div class="col-span-1 bg-[#0f1729] border border-[#172242] rounded-xl p-5 card-glow">
        <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
            <span class="w-1.5 h-4 bg-cyan-500 rounded-full"></span>上传专利
        </h2>
        <form hx-post="/api/patents/upload" hx-encoding="multipart/form-data" hx-target="#uploadResult" hx-swap="afterbegin">
            <div class="mb-4 p-6 border-2 border-dashed border-[#1c2a4f] rounded-lg text-center hover:border-cyan-800/50 transition-colors cursor-pointer"
                 onclick="this.querySelector('input').click()">
                <input type="file" name="file" accept=".pdf" required class="hidden">
                <svg class="w-8 h-8 text-slate-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                <p class="text-xs text-slate-500">点击选择 PDF 文件</p>
                <p class="text-[10px] text-slate-600 mt-1 font-mono">支持 .pdf 格式</p>
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2.5 rounded-lg text-sm font-medium transition-colors">开始上传</button>
        </form>
        <div id="uploadResult"></div>
    </div>

    <!-- Bulk Import -->
    <div class="col-span-1 bg-[#0f1729] border border-[#172242] rounded-xl p-5 card-glow">
        <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
            <span class="w-1.5 h-4 bg-emerald-500 rounded-full"></span>批量导入
        </h2>
        <form hx-post="/api/patents/import" hx-target="#importResult">
            <label class="block text-xs text-slate-500 mb-2 font-mono">服务器目录路径</label>
            <input type="text" name="directory" placeholder="例如：data/pdfs/CN"
                   class="w-full p-2.5 rounded-lg bg-[#0a0e1a] border border-[#1c2a4f] text-slate-200 text-sm placeholder-slate-600 focus:border-cyan-700 focus:outline-none transition-colors mb-4">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-medium transition-colors">批量导入</button>
        </form>
        <div id="importResult" class="mt-3 text-sm"></div>
    </div>

    <!-- Stats -->
    <div class="col-span-1 bg-[#0f1729] border border-[#172242] rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
            <span class="w-1.5 h-4 bg-violet-500 rounded-full"></span>概况
        </h2>
        <div class="space-y-3 text-sm">
            <div class="flex justify-between"><span class="text-slate-500">中文专利</span><span class="text-cyan-400 font-mono">—</span></div>
            <div class="flex justify-between"><span class="text-slate-500">英文专利</span><span class="text-emerald-400 font-mono">—</span></div>
            <div class="flex justify-between"><span class="text-slate-500">扫描件</span><span class="text-amber-400 font-mono">—</span></div>
        </div>
    </div>
</div>

<!-- Patent List -->
<div class="bg-[#0f1729] border border-[#172242] rounded-xl overflow-hidden">
    <div class="px-5 py-4 border-b border-[#172242] flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
            <span class="w-1.5 h-4 bg-amber-500 rounded-full"></span>专利列表
        </h2>
        <span class="text-[10px] text-slate-600 font-mono">点击"抽取"开始智能提取</span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="border-b border-[#172242] text-left">
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider w-16">ID</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">文件名</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider w-16">语言</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider text-right w-16">页数</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider text-right w-20">大小</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider w-24">日期</th>
                    <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider w-28">操作</th>
                </tr>
            </thead>
            <tbody hx-get="/api/patents/?per_page=20" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
                <tr><td colspan="7" class="p-8 text-center">
                    <svg class="w-6 h-6 text-slate-600 animate-spin mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    <span class="text-xs text-slate-600 font-mono">加载专利列表...</span>
                </td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
