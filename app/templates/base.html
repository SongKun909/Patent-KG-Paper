<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Patent-KG Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        .progress-bar { transition: width 0.5s ease; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <nav class="w-64 bg-gray-800 p-4 flex flex-col">
            <div class="text-xl font-bold text-blue-400 mb-8">Patent-KG</div>
            <a href="/dashboard" class="py-2 px-3 rounded mb-1 hover:bg-gray-700 text-gray-300">Dashboard</a>
            <a href="/patents" class="py-2 px-3 rounded mb-1 hover:bg-gray-700 text-gray-300">Patents</a>
            <a href="/tasks" class="py-2 px-3 rounded mb-1 hover:bg-gray-700 text-gray-300">Tasks</a>
            <a href="/results" class="py-2 px-3 rounded mb-1 hover:bg-gray-700 text-gray-300">Results</a>
            <a href="/kg" class="py-2 px-3 rounded mb-1 hover:bg-gray-700 text-gray-300">Knowledge Graph</a>
            <div class="mt-auto pt-4 border-t border-gray-700">
                <span class="text-sm text-gray-500" id="currentUser"></span>
            </div>
        </nav>
        <!-- Content -->
        <main class="flex-1 overflow-auto p-6">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
