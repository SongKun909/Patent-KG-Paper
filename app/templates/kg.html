{% extends "base.html" %}
{% block title %}知识图谱 — Patent-KG{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold text-slate-800 mb-1">知识图谱</h1>
<p class="text-sm text-slate-500 mb-8">探索和分析专利技术指标关系网络</p>

<div class="grid grid-cols-4 gap-6 mb-6">
    <!-- Search -->
    <div class="col-span-1 card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">检索指标</h2>
        <input type="text" name="keyword" placeholder="搜索指标名称..."
               hx-get="/api/kg/search" hx-trigger="keyup changed delay:500ms"
               hx-target="#kgSearchResult"
               class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors mb-3">
        <div id="kgSearchResult" class="max-h-64 overflow-y-auto text-xs space-y-1"></div>
    </div>

    <!-- Graph -->
    <div class="col-span-3 card overflow-hidden">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-700">交互式图谱</h2>
            <span class="text-xs text-slate-400">可拖拽缩放</span>
        </div>
        <div hx-get="/api/kg/visualize?limit=50" hx-trigger="load" hx-target="#graphContainer">
            <div id="graphContainer" class="h-[480px] flex items-center justify-center">
                <p class="text-sm text-slate-400">加载图谱...</p>
            </div>
        </div>
    </div>
</div>

<!-- PageRank + Pearson -->
<div class="grid grid-cols-2 gap-6">
    <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">核心指标排名 <span class="text-xs font-normal text-slate-400 ml-1">PageRank</span></h2>
        <div hx-get="/api/kg/pagerank" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
            <p class="text-sm text-slate-400 py-6 text-center">加载中...</p>
        </div>
    </div>
    <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">指标关联分析 <span class="text-xs font-normal text-slate-400 ml-1">Pearson</span></h2>
        <div hx-get="/api/kg/pearson" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
            <p class="text-sm text-slate-400 py-6 text-center">加载中...</p>
        </div>
    </div>
</div>

{% endblock %}
