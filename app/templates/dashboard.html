{% extends "base.html" %}
{% block title %}工作台 — Patent-KG{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">📊 工作台</h1>

<!-- 统计卡片 -->
<div class="grid grid-cols-4 gap-4 mb-8">
    <div class="bg-gray-800 p-4 rounded-lg text-center">
        <div class="text-3xl font-bold text-blue-400" id="statPatents">—</div>
        <div class="text-sm text-gray-400 mt-1">专利总数</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg text-center">
        <div class="text-3xl font-bold text-green-400" id="statCompleted">—</div>
        <div class="text-sm text-gray-400 mt-1">已完成任务</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg text-center">
        <div class="text-3xl font-bold text-yellow-400" id="statRunning">—</div>
        <div class="text-sm text-gray-400 mt-1">运行中</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg text-center">
        <div class="text-3xl font-bold text-purple-400" id="statQuintuples">—</div>
        <div class="text-sm text-gray-400 mt-1">已抽取五元组</div>
    </div>
</div>

<div class="grid grid-cols-2 gap-6">
    <!-- 快捷操作 -->
    <div class="bg-gray-800 p-4 rounded-lg">
        <h2 class="text-lg font-semibold mb-3">快捷操作</h2>
        <div class="space-y-2">
            <a href="/patents" class="block p-3 bg-blue-600 hover:bg-blue-700 rounded text-center text-sm">📄 上传专利 PDF</a>
            <a href="/tasks" class="block p-3 bg-green-600 hover:bg-green-700 rounded text-center text-sm">⚙️ 查看任务</a>
            <a href="/results" class="block p-3 bg-purple-600 hover:bg-purple-700 rounded text-center text-sm">📋 浏览结果</a>
            <a href="/kg" class="block p-3 bg-orange-600 hover:bg-orange-700 rounded text-center text-sm">🕸️ 知识图谱</a>
        </div>
    </div>
    <!-- 最近任务 -->
    <div class="bg-gray-800 p-4 rounded-lg" hx-get="/api/tasks/" hx-trigger="every 10s">
        <h2 class="text-lg font-semibold mb-3">最近任务</h2>
        <p class="text-gray-400 text-sm">加载中...</p>
    </div>
</div>
{% endblock %}
