<table class="w-full text-sm">
    <thead>
        <tr class="border-b border-gray-600 text-left text-gray-400 text-xs">
            <th class="p-2">指标名称</th><th class="p-2">数值</th><th class="p-2">关系</th>
            <th class="p-2">对象</th><th class="p-2">实验条件</th><th class="p-2">置信度</th>
        </tr>
    </thead>
    <tbody>
        {% for r in items %}
        <tr class="border-b border-gray-700 hover:bg-gray-750">
            <td class="p-2 font-medium text-sm">{{ r.name }}</td>
            <td class="p-2 text-green-400 text-sm">{{ r.value }}</td>
            <td class="p-2 text-sm">{{ r.relation }}</td>
            <td class="p-2 text-sm">{{ r.object }}</td>
            <td class="p-2 text-yellow-400 text-sm">{{ r.condition }}</td>
            <td class="p-2 text-sm">{{ "%.2f"|format(r.confidence) }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if not items %}
<p class="text-gray-500 text-center py-4 text-sm">暂无抽取结果</p>
{% else %}
<div class="text-xs text-gray-500 mt-2 p-2">共 {{ total }} 条结果，当前第 {{ page }} 页（显示 {{ items|length }} 条）</div>
{% endif %}
