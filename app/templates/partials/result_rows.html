<table class="w-full">
    <thead>
        <tr class="border-b border-[#172242] text-left">
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">指标名称</th>
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">数值</th>
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">关系</th>
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">对象</th>
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider">实验条件</th>
            <th class="p-3 text-[11px] font-mono text-slate-500 uppercase tracking-wider text-right">置信度</th>
        </tr>
    </thead>
    <tbody>
        {% for r in items %}
        <tr class="border-b border-[#172242] data-row">
            <td class="p-3 text-sm font-medium text-slate-200">{{ r.name }}</td>
            <td class="p-3 text-sm font-mono text-cyan-400">{{ r.value }}</td>
            <td class="p-3 text-sm text-slate-400">{{ r.relation }}</td>
            <td class="p-3 text-sm text-slate-400">{{ r.object }}</td>
            <td class="p-3 text-sm text-amber-400/80">{{ r.condition }}</td>
            <td class="p-3 text-sm font-mono text-slate-400 text-right">{{ "%.2f"|format(r.confidence) }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if not items %}
<div class="flex flex-col items-center justify-center py-12">
    <svg class="w-10 h-10 text-slate-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5"/></svg>
    <p class="text-sm text-slate-600">暂无抽取结果</p>
    <p class="text-xs text-slate-700 mt-1 font-mono">完成专利抽取任务后在此查看</p>
</div>
{% else %}
<div class="px-4 py-3 border-t border-[#172242] flex items-center justify-between text-[11px] font-mono text-slate-500">
    <span>共 {{ total }} 条结果</span>
    <span>第 {{ page }} 页 · 显示 {{ items|length }} 条</span>
</div>
{% endif %}
