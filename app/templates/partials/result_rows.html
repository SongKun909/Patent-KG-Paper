<table class="w-full data-table">
    <thead>
        <tr>
            <th class="p-3 text-left">指标名称</th>
            <th class="p-3 text-left">数值</th>
            <th class="p-3 text-left">关系</th>
            <th class="p-3 text-left">对象</th>
            <th class="p-3 text-left">实验条件</th>
            <th class="p-3 text-right">置信度</th>
        </tr>
    </thead>
    <tbody>
        {% for r in items %}
        <tr>
            <td class="p-3 text-sm font-medium text-slate-700">{{ r.name }}</td>
            <td class="p-3 text-sm text-blue-600">{{ r.value }}</td>
            <td class="p-3 text-sm text-slate-600">{{ r.relation }}</td>
            <td class="p-3 text-sm text-slate-600">{{ r.object }}</td>
            <td class="p-3 text-sm text-slate-500">{{ r.condition }}</td>
            <td class="p-3 text-sm text-slate-500 text-right">{{ "%.2f"|format(r.confidence) }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if not items %}
<p class="text-sm text-slate-400 py-10 text-center">暂无抽取结果</p>
{% else %}
<div class="px-4 py-3 border-t border-slate-100 text-xs text-slate-400 flex justify-between">
    <span>共 {{ total }} 条</span>
    <span>第 {{ page }} 页 · {{ items|length }} 条</span>
</div>
{% endif %}
