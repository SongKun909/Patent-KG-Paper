{% extends "base.html" %}
{% block title %}任务管理 — Patent-KG{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold text-slate-800 mb-1">任务管理</h1>
<p class="text-sm text-slate-500 mb-8">创建、监控和控制抽取任务</p>

<div class="grid grid-cols-3 gap-6">
    <!-- Create Task -->
    <div class="col-span-1">
        <div class="card p-5 sticky top-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-4">创建任务</h2>
            <form hx-post="/api/tasks/" hx-target="#taskResult">
                <label class="block text-xs text-slate-500 mb-1.5">专利 ID</label>
                <input type="number" name="patent_id" required placeholder="输入专利 ID" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors mb-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition-colors">开始抽取</button>
            </form>
            <div id="taskResult" class="mt-3 text-sm"></div>

            <div class="mt-5 pt-4 border-t border-slate-100">
                <div class="text-xs text-slate-400 space-y-1.5">
                    <div class="flex justify-between"><span>等待中</span><span>pending</span></div>
                    <div class="flex justify-between"><span>运行中</span><span>running</span></div>
                    <div class="flex justify-between"><span>已完成</span><span class="text-emerald-600">completed</span></div>
                    <div class="flex justify-between"><span>已暂停</span><span class="text-amber-600">paused</span></div>
                    <div class="flex justify-between"><span>失败</span><span class="text-red-500">failed</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task List -->
    <div class="col-span-2">
        <div class="card p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-slate-700">任务列表</h2>
                <span class="text-xs text-slate-400">每 5 秒刷新</span>
            </div>
            <div hx-get="/api/tasks/" hx-trigger="every 5s" hx-swap="innerHTML">
                <p class="text-sm text-slate-400 py-10 text-center">加载中...</p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
