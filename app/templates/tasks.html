{% extends "base.html" %}
{% block title %}Tasks — Patent-KG{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Task Management</h1>

<!-- Create Task -->
<div class="bg-gray-800 p-4 rounded-lg mb-6">
    <h2 class="text-lg font-semibold mb-3">Create Extraction Task</h2>
    <form hx-post="/api/tasks/" hx-target="#taskResult">
        <label class="block text-sm mb-1">Patent ID</label>
        <input type="number" name="patent_id" required class="p-2 rounded bg-gray-700 border border-gray-600 mb-3 w-64">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Start Extraction</button>
    </form>
    <div id="taskResult" class="mt-3"></div>
</div>

<!-- Task List (HTMX polling) -->
<div class="bg-gray-800 p-4 rounded-lg" hx-get="/api/tasks/" hx-trigger="every 5s" hx-swap="innerHTML">
    <p class="text-gray-400">Loading tasks...</p>
</div>
{% endblock %}
