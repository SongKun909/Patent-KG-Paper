{% extends "base.html" %}
{% block title %}任务管理 — Patent-KG{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">⚙️ 任务管理</h1>

<!-- 创建任务 -->
<div class="bg-gray-800 p-4 rounded-lg mb-6">
    <h2 class="text-lg font-semibold mb-3">创建抽取任务</h2>
    <form hx-post="/api/tasks/" hx-target="#taskResult" class="flex items-end gap-3">
        <div>
            <label class="block text-sm mb-1 text-gray-400">专利 ID</label>
            <input type="number" name="patent_id" required class="p-2.5 rounded bg-gray-700 border border-gray-600 w-40 text-gray-100" placeholder="输入专利ID">
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded text-sm">开始抽取</button>
    </form>
    <div id="taskResult" class="mt-3 text-sm"></div>
</div>

<!-- 任务列表（HTMX 自动轮询） -->
<div class="bg-gray-800 p-4 rounded-lg">
    <h2 class="text-lg font-semibold mb-3">任务列表 <span class="text-xs text-gray-500">（每 5 秒自动刷新）</span></h2>
    <div hx-get="/api/tasks/" hx-trigger="every 5s" hx-swap="innerHTML">
        <p class="text-gray-400 text-sm">加载中...</p>
    </div>
</div>
{% endblock %}
