{% extends "base.html" %}
{% block title %}任务管理 — Patent-KG{% endblock %}
{% block content %}

<div class="mb-8">
    <h1 class="text-2xl font-bold text-white tracking-tight">任务管理</h1>
    <p class="text-sm text-slate-500 mt-1 font-mono">创建 · 监控 · 控制抽取任务</p>
</div>

<div class="grid grid-cols-3 gap-6">
    <!-- Create Task -->
    <div class="col-span-1">
        <div class="bg-[#0f1729] border border-[#172242] rounded-xl p-5 card-glow sticky top-6">
            <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                <span class="w-1.5 h-4 bg-cyan-500 rounded-full"></span>创建任务
            </h2>
            <form hx-post="/api/tasks/" hx-target="#taskResult">
                <label class="block text-xs text-slate-500 mb-2 font-mono">专利 ID</label>
                <input type="number" name="patent_id" required placeholder="输入专利 ID"
                       class="w-full p-2.5 rounded-lg bg-[#0a0e1a] border border-[#1c2a4f] text-slate-200 text-sm placeholder-slate-600 focus:border-cyan-700 focus:outline-none transition-colors mb-4">
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2.5 rounded-lg text-sm font-medium transition-colors">
                    开始智能抽取
                </button>
            </form>
            <div id="taskResult" class="mt-3 text-sm"></div>

            <div class="mt-5 pt-4 border-t border-[#172242]">
                <div class="text-xs text-slate-500 font-mono space-y-1.5">
                    <div class="flex justify-between"><span>等待中</span><span class="text-slate-600">pending</span></div>
                    <div class="flex justify-between"><span>排队中</span><span class="text-purple-400">queued</span></div>
                    <div class="flex justify-between"><span>运行中</span><span class="text-cyan-400">running</span></div>
                    <div class="flex justify-between"><span>已完成</span><span class="text-emerald-400">completed</span></div>
                    <div class="flex justify-between"><span>已暂停</span><span class="text-amber-400">paused</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task List -->
    <div class="col-span-2">
        <div class="bg-[#0f1729] border border-[#172242] rounded-xl p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <span class="w-1.5 h-4 bg-emerald-500 rounded-full"></span>任务列表
                </h2>
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot"></span>
                    <span class="text-[10px] text-slate-600 font-mono">每 5 秒自动刷新</span>
                </div>
            </div>
            <div hx-get="/api/tasks/" hx-trigger="every 5s" hx-swap="innerHTML">
                <div class="flex items-center justify-center py-16">
                    <div class="flex flex-col items-center gap-3">
                        <svg class="w-6 h-6 text-slate-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        <span class="text-xs text-slate-600 font-mono">加载任务...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
