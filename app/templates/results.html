{% extends "base.html" %}
{% block title %}Results — Patent-KG{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Extraction Results</h1>

<div class="bg-gray-800 p-4 rounded-lg mb-6">
    <div class="flex gap-4 mb-4">
        <input type="text" name="name" placeholder="Filter by indicator name..."
               hx-get="/api/results/" hx-trigger="keyup changed delay:500ms"
               hx-target="#resultsTable" hx-include="[name='name']"
               class="p-2 rounded bg-gray-700 border border-gray-600 flex-1">
        <a href="/api/results/export" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-center">Export CSV</a>
    </div>
    <div hx-get="/api/results/?per_page=50" hx-trigger="load" hx-target="#resultsTable">
        <div id="resultsTable" class="text-gray-400">Loading...</div>
    </div>
</div>
{% endblock %}
