{% extends "base.html" %}
{% block title %}抽取结果 — Patent-KG{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold text-slate-800 mb-1">抽取结果</h1>
<p class="text-sm text-slate-500 mb-8">浏览、筛选和导出技术指标五元组</p>

<!-- Filter -->
<div class="card p-5 mb-6">
    <div class="flex items-end gap-4">
        <div class="flex-1">
            <label class="block text-xs text-slate-500 mb-1.5">按指标名称筛选</label>
            <input type="text" name="name" placeholder="能量密度、比容量..."
                   hx-get="/api/results/" hx-trigger="keyup changed delay:500ms"
                   hx-target="#resultsTable" hx-include="[name='name']"
                   class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors">
        </div>
        <a href="/api/results/export" class="flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-sm text-slate-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            导出 CSV
        </a>
    </div>
</div>

<!-- Results Table -->
<div class="card overflow-hidden">
    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-700">技术指标五元组</h2>
    </div>
    <div class="overflow-x-auto" hx-get="/api/results/?per_page=50" hx-trigger="load" hx-target="#resultsTable">
        <div id="resultsTable">
            <p class="text-sm text-slate-400 py-10 text-center">加载中...</p>
        </div>
    </div>
</div>

{% endblock %}
